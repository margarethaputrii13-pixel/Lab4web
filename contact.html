<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Layout Sederhana</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Styling tambahan khusus form kontak */
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-group input, 
    .form-group textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn-submit {
      background-color: #1f5faa;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-submit:hover {
      background-color: #164377;
    }
  </style>
</head>
<body>
  <div id="container">
    <header>
      <h1>Layout Sederhana</h1>
    </header>

    <nav>
      <a href="home.html">Home</a>
      <a href="home.html">Artikel</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Kontak</a>
    </nav>

    <section id="hero">
      <h1>Hubungi Kami</h1>
      <p>Silakan isi formulir di bawah ini untuk mengirimkan pesan atau pertanyaan kepada kami.</p>
    </section>

    <section id="wrapper">
      <section id="main" style="width: 100%;">
        <form action="#" method="post">
          <div class="form-group">
            <label for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda..." required>
          </div>

          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Masukkan email Anda..." required>
          </div>

          <div class="form-group">
            <label for="message">Pesan / Message:</label>
            <textarea id="message" name="message" rows="5" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
          </div>

          <button type="submit" class="btn-submit">Kirim Pesan</button>
        </form>
      </section>
    </section>

    <footer>
      <p>&copy; 2026 - Universitas Pelita Bangsa</p>
    </footer>
  </div>
</body>
</html>
